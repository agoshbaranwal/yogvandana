<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martel:wght@400;600;700&family=Mukta:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; color: #231A12; font-family: Mukta, 'Noto Sans', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B9460F; } a:hover { color: #8F350B; }
    .serif { font-family: Martel, Georgia, serif; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6E5F4E; }
  </style>
</helmet>
<div style="width: 720px; height: 440px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 1fr auto; background: #FBF8F1;">
  <div style="display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 40px; border-right: 1px solid #E4D9C7;">
    <div class="label">Option B · Devanagari monogram</div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="serif" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid #E7641E; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; line-height: 1; color: #231A12; padding-top: 4px; box-sizing: border-box;">व</div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div class="serif" style="font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.015em; white-space: nowrap;">Yog Vandana</div>
        <div class="serif" style="font-size: 15px; font-weight: 600; color: #6E5F4E; letter-spacing: 0.02em;">योग वंदना</div>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 40px; background: #27314F; color: #FBF8F1;">
    <div class="label" style="color: rgba(251,248,241,0.7);">On the indigo footer</div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <div class="serif" style="width: 64px; height: 64px; border-radius: 50%; border: 2px solid #E7641E; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; line-height: 1; color: #FBF8F1; padding-top: 4px; box-sizing: border-box;">व</div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div class="serif" style="font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.015em; white-space: nowrap;">Yog Vandana</div>
        <div class="serif" style="font-size: 15px; font-weight: 600; color: #E7641E; letter-spacing: 0.02em;">योग वंदना</div>
      </div>
    </div>
  </div>
  <div style="grid-column: 1 / -1; display: flex; align-items: center; gap: 28px; padding: 18px 40px; border-top: 1px solid #E4D9C7;">
    <div class="label">Small sizes</div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="serif" style="width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #E7641E; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; line-height: 1; padding-top: 2px; box-sizing: border-box;">व</div>
      <div class="serif" style="font-size: 20px; font-weight: 700;">Yog Vandana</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="serif" style="width: 32px; height: 32px; border-radius: 50%; background: #E7641E; color: #FBF8F1; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; line-height: 1; padding-top: 2px; box-sizing: border-box;">व</div>
      <div class="serif" style="width: 16px; height: 16px; border-radius: 50%; background: #E7641E; color: #FBF8F1; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; line-height: 1; padding-top: 1px; box-sizing: border-box;">व</div>
      <div class="label">favicon</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
