<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;800&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; color: #231A12; font-family: 'Baloo 2', 'Arial Rounded MT Bold', ui-rounded, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #A05000; text-decoration: none; } a:hover { color: #6B3500; }
    p, h1, h2, h3 { margin: 0; }
    .cap { font-size: 16px; line-height: 1.5; color: #6E5F4E; }
    .body { font-size: 18px; line-height: 1.7; }
    .h2 { font-size: 26px; line-height: 1.2; font-weight: 800; }
    .tag { position: absolute; display: flex; align-items: center; gap: 8px; text-decoration: none; color: #231A12; }
    .dot { width: 30px; height: 30px; border-radius: 50%; background: #FF9933; border: 3px solid #FBF8F1; box-shadow: 0 0 0 2px #231A12; flex: none; }
    .nm { font-size: 18px; font-weight: 800; line-height: 1.1; background: #FBF8F1; padding: 4px 10px; border-radius: 999px; border: 1.5px solid #231A12; white-space: nowrap; }
    .nm.on { background: #231A12; color: #FF9933; }
  </style>
</helmet>
<div style="width: 390px; background: #FBF8F1; display: flex; flex-direction: column; padding-bottom: 28px;">
  <div style="padding: 24px 16px 6px; display: flex; flex-direction: column; gap: 4px;">

    <p class="cap">जगह पर छुइए। हर एक की अपनी पर्ची और अपने लोग।</p>
  </div>

      <g fill="#F1E7D6" stroke="#231A12" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
        <!-- head and neck -->
        <circle cx="195" cy="62" r="36"/>
        <path d="M183 98 L207 98 L209 118 L181 118 Z"/>
        <!-- one symmetric outline: shoulders, arms at the sides, torso, legs, feet -->
        <path d="M183 118 L150 126 L128 140 L118 220 L108 300 L106 340 L104 362 L120 368 L126 346 L132 300 L140 220 L148 160 L150 160 L158 270 L150 318 L148 340 L156 460 L160 570 L158 596 L150 608 L184 608 L186 596 L184 570 L186 470 L190 352 L195 340 L200 352 L204 470 L206 570 L204 596 L206 608 L240 608 L232 596 L230 570 L234 460 L242 340 L240 318 L232 270 L240 160 L242 160 L250 220 L258 300 L264 346 L270 368 L286 362 L284 340 L282 300 L272 220 L262 140 L240 126 L207 118 Z"/>
      </g>
      <!-- collarbone, lightly -->
      <path d="M170 150 C182 160 208 160 220 150" fill="none" stroke="#B5A08A" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <a class="tag" href="#" style="left: 28px; top: 40px;"><span class="nm">नींद और तनाव</span><span class="dot"></span></a>

    <a class="tag" href="#" style="left: 181px; top: 94px;"><span class="dot"></span><span class="nm">थायराइड</span></a>

    <a class="tag" href="#" style="left: 93px; top: 176px;"><span class="nm">बीपी</span><span class="dot"></span></a>

    <a class="tag" href="#" style="left: 207px; top: 236px;"><span class="dot"></span><span class="nm on">शुगर</span></a>

    <a class="tag" href="#" style="left: 69px; top: 276px;"><span class="nm">मोटापा</span><span class="dot"></span></a>

    <a class="tag" href="#" style="left: 226px; top: 288px;"><span class="dot"></span><span class="nm">कमर दर्द</span></a>

    <a class="tag" href="#" style="left: 2px; top: 318px;"><span class="nm">महिलाओं की समस्याएँ</span><span class="dot"></span></a>

    <a class="tag" href="#" style="left: 204px; top: 458px;"><span class="dot"></span><span class="nm">घुटने का दर्द</span></a>
  </div>

  <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 10px;">
    <div style="background: #FFFFFF; border: 1px solid #E4D9C7; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: #E4F0F9; color: #1A6FA8; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5.5c0 0-12.5 13.7-12.5 21.8A12.5 12.5 0 0 0 36.5 27.3C36.5 19.2 24 5.5 24 5.5z"/><path d="M17.6 28.2a6.4 6.4 0 0 0 6.4 6.4"/></svg></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex: 1;">
        <div style="font-size: 22px; font-weight: 800; line-height: 1.15;">शुगर</div>
        <div class="cap">टाइप-2, प्री-डायबिटीज़ · <span style="color: #6E5F4E; text-decoration: underline dotted;">[N]</span> विद्यार्थी</div>
      </div>
      <a href="#" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; background: #FF9933; color: #231A12; font-size: 16px; font-weight: 800;">देखें</a>
    </div>
    <p class="cap">और भी: गर्दन, अस्थमा, साइनस, कब्ज़, गठिया — <a href="#" style="font-weight: 800; text-decoration: underline; text-underline-offset: 3px;">पूछिए</a></p>
  </div>
</div>
</x-dc>
</body>
</html>
