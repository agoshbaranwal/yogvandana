<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martel:wght@400;600;700&family=Mukta:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #FBF8F1; color: #231A12; font-family: Mukta, 'Noto Sans', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #B9460F; } a:hover { color: #8F350B; }
    .serif { font-family: Martel, Georgia, serif; }
    .label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6E5F4E; }
  </style>
</helmet>
<div style="width: 720px; height: 440px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 1fr auto; background: #FBF8F1;">
  <div style="display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 32px; border-right: 1px solid #E4D9C7;">
    <div class="label">Option C · Diya, the lamp</div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="52" height="56" viewBox="0 0 64 64" fill="#E7641E"><path d="M32 4 C 24 15, 21 24, 32 35 C 43 24, 40 15, 32 4 Z"></path><path d="M10 42 H54 C 52 53, 42 60, 32 60 C 22 60, 12 53, 10 42 Z"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div class="serif" style="font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.015em; white-space: nowrap;">Yog Vandana</div>
        <div class="serif" style="font-size: 15px; font-weight: 600; color: #6E5F4E; letter-spacing: 0.02em;">योग वंदना</div>
      </div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 32px; background: #27314F; color: #FBF8F1;">
    <div class="label" style="color: rgba(251,248,241,0.7);">On the indigo footer</div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="52" height="56" viewBox="0 0 64 64" fill="#E7641E"><path d="M32 4 C 24 15, 21 24, 32 35 C 43 24, 40 15, 32 4 Z"></path><path d="M10 42 H54 C 52 53, 42 60, 32 60 C 22 60, 12 53, 10 42 Z"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div class="serif" style="font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.015em; white-space: nowrap;">Yog Vandana</div>
        <div class="serif" style="font-size: 15px; font-weight: 600; color: #E7641E; letter-spacing: 0.02em;">योग वंदना</div>
      </div>
    </div>
  </div>
  <div style="grid-column: 1 / -1; display: flex; align-items: center; gap: 28px; padding: 18px 32px; border-top: 1px solid #E4D9C7;">
    <div class="label">Small sizes</div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="22" height="24" viewBox="0 0 64 64" fill="#E7641E"><path d="M32 4 C 24 15, 21 24, 32 35 C 43 24, 40 15, 32 4 Z"></path><path d="M10 42 H54 C 52 53, 42 60, 32 60 C 22 60, 12 53, 10 42 Z"></path></svg>
      <div class="serif" style="font-size: 20px; font-weight: 700;">Yog Vandana</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 32px; height: 32px; border-radius: 4px; background: #E7641E; display: flex; align-items: center; justify-content: center;"><svg width="20" height="22" viewBox="0 0 64 64" fill="#FBF8F1"><path d="M32 4 C 24 15, 21 24, 32 35 C 43 24, 40 15, 32 4 Z"></path><path d="M10 42 H54 C 52 53, 42 60, 32 60 C 22 60, 12 53, 10 42 Z"></path></svg></div>
      <div style="width: 16px; height: 16px; border-radius: 2px; background: #E7641E; display: flex; align-items: center; justify-content: center;"><svg width="10" height="11" viewBox="0 0 64 64" fill="#FBF8F1"><path d="M32 4 C 24 15, 21 24, 32 35 C 43 24, 40 15, 32 4 Z"></path><path d="M10 42 H54 C 52 53, 42 60, 32 60 C 22 60, 12 53, 10 42 Z"></path></svg></div>
      <div class="label">favicon</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
